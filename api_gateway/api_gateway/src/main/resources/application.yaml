server :
  port : 8282

spring :
    application:
        name: api-gateway
    cloud:
        gateway:
          server :
            webflux :
              routes :
                - id : order-service
                  uri : lb://order-service
                  predicates :
                    - Path=/v1/orders/**
                - id : product-service
                  uri : lb://product-service
                  predicates :
                    - Path=/v1/products/**

eureka:
    client:
        service-url:
            defaultZone: http://localhost:8761/eureka/ # URL c?a Eureka Server

